[project]
name = "gherkin-chess"
version = "0.1.0"
description = "A chess environment for AI agents where moves must be externalized as Gherkin and materialized via OKF"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11.0",
    "gherkin-official>=29.0.0",
    "okf-parser>=0.45.0",
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.28.1",
    "openskill>=6.2.0",
    "litellm>=1.100.1",
    "cyclopts>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
gherkin-chess = "gherkin_chess.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
